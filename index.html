<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aaron Brooks — full stack software engineer. I build the test-taking software 30 million students can't opt out of."
    />
    <title>Aaron Brooks — Full Stack Software Engineer</title>
    <script>
      // Restore a remembered dark choice before first paint. Paper is the
      // default, so there is nothing to do for everyone else.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
